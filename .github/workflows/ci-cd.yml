name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/edm-web

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore EnterpriseDataManager/EnterpriceDataManager.sln
      - name: Build
        run: dotnet build EnterpriseDataManager/EnterpriceDataManager.sln --no-restore -c Release
      - name: Unit Tests
        run: dotnet test EnterpriseDataManager/EnterpriseDataManager.UnitTests/EnterpriseDataManager.UnitTests.csproj --no-build -c Release --logger trx
      - name: Integration Tests
        run: dotnet test EnterpriseDataManager/EnterpriseDataManager.IntegrationTests/EnterpriseDataManager.IntegrationTests.csproj --no-build -c Release --logger trx
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/*.trx'
          reporter: dotnet-trx

  sast:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build EnterpriseDataManager/EnterpriceDataManager.sln -c Release
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, sast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: EnterpriseDataManager
          file: EnterpriseDataManager/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
