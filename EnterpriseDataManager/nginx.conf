# ──────────────────────────────────────────────────────────────────────────────
# Enterprise Data Manager — Nginx reverse proxy
#
# Mounted as /etc/nginx/conf.d/default.conf (inside the http {} block).
# The docker-compose nginx service replaces ${DOMAIN} via envsubst before start.
#
# Certificate paths expected at runtime:
#   /etc/nginx/ssl/fullchain.pem   — server cert + intermediates
#   /etc/nginx/ssl/privkey.pem     — private key
#
# Let's Encrypt: map /etc/letsencrypt/live/${DOMAIN} → /etc/nginx/ssl via volume
# Internal CA  : map ./certs/ → /etc/nginx/ssl via volume
# ──────────────────────────────────────────────────────────────────────────────

# Rate-limit zones (defined in http context via conf.d include)
limit_req_zone $binary_remote_addr zone=edm_global:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=edm_auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=edm_api:10m    rate=60r/m;

# Upstream — keepalive pool to the .NET app
upstream edm_app {
    server web:8080;
    keepalive 32;
}

# ── HTTP: ACME challenge passthrough + unconditional redirect to HTTPS ─────────
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt / ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # ── TLS ────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                                           always;
    add_header X-Content-Type-Options     nosniff                                        always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"     always;

    # Hide Nginx version
    server_tokens off;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # ── Request size limits ────────────────────────────────────────────────────
    client_max_body_size 50m;

    # ── Auth endpoints — strict rate limit ────────────────────────────────────
    location ~ ^/api/v[0-9]+/auth/ {
        limit_req zone=edm_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://edm_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── API endpoints — standard rate limit ───────────────────────────────────
    location /api/ {
        limit_req zone=edm_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://edm_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── Health checks — no rate limit, no auth logging ────────────────────────
    location ~ ^/(health|healthz|ready)$ {
        access_log off;

        proxy_pass         http://edm_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ── All other routes (MVC pages, static files) ────────────────────────────
    location / {
        limit_req zone=edm_global burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://edm_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
