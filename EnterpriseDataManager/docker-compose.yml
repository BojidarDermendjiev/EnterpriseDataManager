services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edm
      POSTGRES_USER: edm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Run migrations: docker compose run --rm web dotnet ef database update --project EnterpriseDataManager.Data
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=edm;Username=edm_user;Password=${POSTGRES_PASSWORD:-changeme}"
      Jwt__Secret: ${JWT_SECRET:-replace-with-32-char-secret-here}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  pgdata:
